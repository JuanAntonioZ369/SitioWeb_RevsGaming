<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — RevsGaming</title>
  <meta name="robots" content="noindex" />
  <script>if(localStorage.getItem('revsgaming-theme')==='light')document.documentElement.classList.add('light-mode')</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #0d1117;
      --bg-main:    #1b2838;
      --bg-card:    #16202d;
      --bg-panel:   #1e2d3d;
      --green:      #7EC8A0;
      --green-light:#a8d8b8;
      --red:        #C47E7E;
      --accent:     #66c0f4;
      --text:       #c6d4df;
      --text-muted: #8f98a0;
      --border:     rgba(102,192,244,0.15);
      --glass:      rgba(22,32,45,0.85);
    }
    html.light-mode {
      --bg-deep:    #f0f4f8; --bg-main: #e2e8f0; --bg-card: #ffffff;
      --bg-panel:   #f8fafc; --green: #2d8a5e; --green-light: #3aab76;
      --accent:     #1a6fa8; --text: #1e293b; --text-muted: #64748b;
      --border:     rgba(0,0,0,0.1); --glass: rgba(255,255,255,0.9);
    }

    html { font-size: 16px; }
    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1,h2,h3,h4 { font-family: 'Space Grotesk', sans-serif; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; font-family: 'Inter', sans-serif; }

    /* NAVBAR */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem; font-weight: 700; color: #fff;
      margin-right: auto;
    }
    .nav-logo img { height: 36px; }
    .btn-nav {
      padding: 8px 16px; border-radius: 6px;
      font-size: 0.85rem; font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      transition: background 0.2s, color 0.2s;
    }
    .btn-nav-ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-nav-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-nav-green { background: var(--green); color: #0d1117; }
    .btn-nav-green:hover { background: var(--green-light); }

    /* MAIN */
    .page {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 24px 80px;
    }

    .account-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* USER CARD */
    .user-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .avatar {
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem; font-weight: 700; color: #0d1117;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .user-info h2 {
      font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 4px;
    }
    .user-info p { font-size: 0.85rem; color: var(--text-muted); }

    /* SUBSCRIPTION CARD */
    .sub-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .sub-header {
      padding: 20px 24px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .sub-header-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-muted);
    }
    .plan-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.03em; text-transform: uppercase;
    }
    .plan-trial   { background: rgba(102,192,244,0.12); color: var(--accent); border: 1px solid rgba(102,192,244,0.3); }
    .plan-monthly { background: rgba(126,200,160,0.12); color: var(--green);  border: 1px solid rgba(126,200,160,0.3); }
    .plan-annual  { background: rgba(255,213,100,0.12); color: #f0c040;       border: 1px solid rgba(255,213,100,0.3); }
    .plan-expired { background: rgba(196,126,126,0.12); color: var(--red);    border: 1px solid rgba(196,126,126,0.3); }

    .sub-body { padding: 24px; }

    .sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .sub-row:last-of-type { border-bottom: none; }
    .sub-row-label { color: var(--text-muted); font-size: 0.85rem; }
    .sub-row-val   { font-weight: 600; color: #fff; }
    .sub-row-val.active { color: var(--green); }
    .sub-row-val.expired { color: var(--red); }

    .days-bar-wrap { margin-top: 16px; }
    .days-bar-label {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px;
    }
    .days-bar {
      height: 6px; border-radius: 4px;
      background: rgba(102,192,244,0.1);
      overflow: hidden;
    }
    .days-bar-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--green), var(--accent));
      transition: width 0.6s ease;
    }

    /* ACTIONS */
    .actions {
      display: flex; flex-direction: column; gap: 10px;
    }
    .btn-action {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 20px; border-radius: 10px;
      font-size: 0.9rem; font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
    }
    .btn-action:hover { transform: translateY(-1px); }
    .btn-download {
      background: var(--green); color: #0d1117;
    }
    .btn-download:hover { background: var(--green-light); }
    .btn-upgrade {
      background: transparent; color: var(--accent);
      border: 1px solid rgba(102,192,244,0.3);
    }
    .btn-upgrade:hover { background: rgba(102,192,244,0.08); border-color: var(--accent); }
    .btn-logout {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* LOADING */
    .loading {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted); font-size: 0.9rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .user-card { flex-direction: column; text-align: center; }
      .page { padding: 32px 16px 60px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-logo">
      <img src="/logoPrimary.png" alt="RevsGaming"
           onerror="this.style.display='none'">
      RevsGaming
    </a>
    <a href="/games/" class="btn-nav btn-nav-ghost">Games</a>
    <a href="/forums/" class="btn-nav btn-nav-ghost">Forums</a>
    <a href="/download/" class="btn-nav btn-nav-green">Download</a>
  </nav>

  <!-- PAGE -->
  <div class="page">
    <div class="account-wrap" id="accountWrap">
      <div class="loading">
        <div class="spinner"></div>
        Loading your account...
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL  = 'https://kyoyunuwfuujqdomdmlh.supabase.co'
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5b3l1bnV3ZnV1anFkb21kbWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTY5MDksImV4cCI6MjA5NzE5MjkwOX0.AJfWxp7rcn9psHFZQpX9qmCw32rsYo9pYiIpxHfIX3I'
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON)

    const PLAN_LABELS = { trial: 'Free Trial', monthly: 'Monthly', annual: 'Annual' }
    const PLAN_DAYS   = { trial: 60, monthly: 30, annual: 365 }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
    }

    function daysLeft(iso) {
      return Math.max(0, Math.ceil((new Date(iso) - Date.now()) / 86400000))
    }

    function avatarInitial(name) {
      return (name || '?').charAt(0).toUpperCase()
    }

    async function render(user, sub) {
      const wrap = document.getElementById('accountWrap')
      const username = user.user_metadata?.username || user.email.split('@')[0]
      const isActive = sub && sub.status === 'active' && new Date(sub.expires_at) > new Date()
      const plan     = sub?.plan || 'trial'
      const planLabel = PLAN_LABELS[plan] || plan
      const expires  = sub?.expires_at
      const days     = expires ? daysLeft(expires) : 0
      const totalDays = PLAN_DAYS[plan] || 60
      const pct = expires ? Math.min(100, Math.round((days / totalDays) * 100)) : 0

      const badgeClass = !isActive ? 'plan-expired' : plan === 'annual' ? 'plan-annual' : plan === 'monthly' ? 'plan-monthly' : 'plan-trial'
      const badgeLabel = !isActive ? 'Expired' : planLabel

      const upgradeBtn = (!isActive || plan === 'trial') ? `
        <a href="/upgrade" class="btn-action btn-upgrade">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>
          ${plan === 'trial' ? 'Upgrade plan' : 'Renew subscription'}
        </a>` : ''

      wrap.innerHTML = `
        <!-- User -->
        <div class="user-card">
          <div class="avatar">${avatarInitial(username)}</div>
          <div class="user-info">
            <h2>${escHtml(username)}</h2>
            <p>${escHtml(user.email)}</p>
          </div>
        </div>

        <!-- Subscription -->
        <div class="sub-card">
          <div class="sub-header">
            <span class="sub-header-title">Subscription</span>
            <span class="plan-badge ${badgeClass}">${badgeLabel}</span>
          </div>
          <div class="sub-body">
            <div class="sub-row">
              <span class="sub-row-label">Status</span>
              <span class="sub-row-val ${isActive ? 'active' : 'expired'}">${isActive ? '● Active' : '● Expired'}</span>
            </div>
            <div class="sub-row">
              <span class="sub-row-label">Plan</span>
              <span class="sub-row-val">${planLabel}</span>
            </div>
            ${expires ? `
            <div class="sub-row">
              <span class="sub-row-label">${isActive ? 'Valid until' : 'Expired on'}</span>
              <span class="sub-row-val">${formatDate(expires)}</span>
            </div>` : ''}
            ${isActive && expires ? `
            <div class="days-bar-wrap">
              <div class="days-bar-label">
                <span>${days} days remaining</span>
                <span>${pct}%</span>
              </div>
              <div class="days-bar">
                <div class="days-bar-fill" style="width:${pct}%"></div>
              </div>
            </div>` : ''}
          </div>
        </div>

        <!-- Actions -->
        <div class="actions">
          <a href="/download/" class="btn-action btn-download">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download RevsGaming
          </a>
          ${upgradeBtn}
          <button class="btn-action btn-logout" id="btnLogout">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
          </button>
        </div>
      `

      document.getElementById('btnLogout').addEventListener('click', async () => {
        await db.auth.signOut()
        window.location.href = '/'
      })
    }

    function escHtml(s) {
      const d = document.createElement('div')
      d.textContent = s
      return d.innerHTML
    }

    async function init() {
      const { data: { session } } = await db.auth.getSession()
      if (!session) {
        window.location.href = '/register?login=1&redirect=/dashboard'
        return
      }

      const user = session.user

      // Traer suscripción
      const { data: subs } = await db
        .from('subscriptions')
        .select('plan, status, expires_at')
        .eq('user_id', user.id)
        .order('expires_at', { ascending: false })
        .limit(1)

      render(user, subs?.[0] || null)
    }

    init()
  </script>
</body>
</html>
